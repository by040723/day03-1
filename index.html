<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리동네 숨은맛집</title>
<style>
  /* 역할 기반 색 토큰: 포인트는 연한 하늘색, 배경은 아주 연한 노랑 */
  :root {
    --bg-page: #f6f2e4;
    --bg-layer: #ffffff;
    --bg-fill: #f7f8f9;
    --bg-brand-solid: #8fd0f3;
    --bg-brand-solid-pressed: #6dbdea;
    --bg-brand-weak: #eaf6fd;
    --bg-brand-weak-pressed: #d8eefb;
    --fg-neutral: #1a1c20;
    --fg-neutral-muted: #555d6d;
    --fg-neutral-subtle: #868b94;
    --fg-brand: #2b8fc6;
    --fg-brand-contrast: #0f4c6b;
    --fg-critical: #ca1d13;
    --stroke-neutral-weak: #e6e8ec;
    --stroke-focus-ring: #5e98fe;
    --shadow-s1: 0 1px 4px rgba(0, 0, 0, .08);
    --shadow-s3: 0 4px 16px rgba(0, 0, 0, .12);
    --r-input: 12px;
    --r-card: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 16px; line-height: 22px;
    background: var(--bg-page);
    color: var(--fg-neutral);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 56px; }
  h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 700; }
  .sub { margin: 6px 0 20px; color: var(--fg-neutral-subtle); font-size: 14px; line-height: 19px; }

  form, .card {
    background: var(--bg-layer);
    border: 1px solid var(--stroke-neutral-weak);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-s1);
  }
  form { padding: 16px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--fg-neutral-muted); }
  input, select {
    font: inherit; font-size: 16px; font-weight: 400;
    padding: 11px 14px;
    border: 1px solid var(--stroke-neutral-weak);
    border-radius: var(--r-input);
    background: var(--bg-layer);
    color: var(--fg-neutral);
    width: 100%;
  }
  input::placeholder { color: #b0b3ba; }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--stroke-focus-ring);
    outline-offset: 1px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }

  button {
    font: inherit; font-weight: 600; cursor: pointer;
    border: 0; border-radius: var(--r-input); padding: 12px 16px;
    transition: background-color .12s ease;
  }
  .add { background: var(--bg-brand-solid); color: var(--fg-neutral); }
  .add:hover:not(:disabled) { background: var(--bg-brand-solid-pressed); }
  .add:disabled { opacity: .6; cursor: wait; }
  .field { display: grid; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--fg-neutral-muted); }
  .rating-btns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .star-btn {
    background: var(--bg-layer); color: var(--fg-neutral-muted);
    border: 1px solid var(--stroke-neutral-weak); padding: 10px 0;
  }
  .star-btn:hover { background: var(--bg-brand-weak); }
  .star-btn[aria-checked="true"] {
    background: var(--bg-brand-solid); border-color: var(--bg-brand-solid); color: var(--fg-neutral);
  }
  .ai { background: var(--bg-brand-weak); color: var(--fg-brand-contrast); }
  .ai:hover:not(:disabled) { background: var(--bg-brand-weak-pressed); }
  .ai:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--fg-critical); font-size: 13px; line-height: 18px; min-height: 18px; margin: 0; }

  .list-head { display: flex; justify-content: space-between; align-items: center; margin: 28px 0 12px; position: relative; }
  h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; }
  .icon-btn {
    background: var(--bg-layer); color: var(--fg-neutral-muted);
    width: 40px; height: 40px; padding: 0; border-radius: 50%;
    border: 1px solid var(--stroke-neutral-weak);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--bg-brand-weak); }
  .icon-btn.on { background: var(--bg-brand-solid); border-color: var(--bg-brand-solid); color: var(--fg-neutral); }
  .search-pop {
    position: absolute; right: 0; top: 48px; z-index: 5;
    width: min(240px, calc(100vw - 32px));
    background: var(--bg-layer);
    border: 1px solid var(--stroke-neutral-weak);
    border-radius: var(--r-input);
    box-shadow: var(--shadow-s3);
    padding: 8px;
    display: flex; gap: 6px; align-items: center;
  }
  .search-pop input { padding: 8px 12px; font-size: 15px; }
  .search-pop .clear { background: transparent; color: var(--fg-neutral-subtle); padding: 6px 8px; }

  /* 한 줄에 카드 두 장 */
  #list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0; margin: 0; list-style: none; align-items: start; }
  .card { padding: 14px; display: flex; flex-direction: column; min-width: 0; }
  .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .info-col { min-width: 0; }
  .name { font-size: 16px; line-height: 22px; font-weight: 700; margin: 0; word-break: break-word; }
  .menu { color: var(--fg-neutral-muted); font-size: 13px; line-height: 18px; margin: 2px 0 0; word-break: break-word; }
  .food-emoji { font-size: 26px; line-height: 30px; flex-shrink: 0; }
  .stars { color: var(--fg-brand); letter-spacing: 1px; margin: 8px 0 0; font-size: 14px; }
  .review {
    margin: 10px 0 0; word-break: break-word; font-size: 14px; line-height: 20px;
    background: var(--bg-brand-weak); color: var(--fg-brand-contrast);
    border-radius: 10px; padding: 8px 10px;
  }
  .del {
    background: var(--bg-fill); color: var(--fg-neutral-muted);
    padding: 6px 12px; font-size: 13px; border-radius: 999px;
    align-self: flex-end; margin-top: 10px;
  }
  .del:hover { background: var(--bg-brand-weak); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--fg-neutral-subtle); padding: 32px 0; font-size: 14px; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .user-btn {
    background: var(--bg-layer); color: var(--fg-neutral-muted);
    border: 1px solid var(--stroke-neutral-weak);
    width: 42px; height: 42px; padding: 0; border-radius: 50%;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .user-btn:hover { background: var(--bg-brand-weak); }
  .user-btn.on { background: var(--bg-brand-solid); border-color: var(--bg-brand-solid); color: var(--fg-neutral); }
  dialog {
    border: 0; border-radius: 20px; padding: 20px;
    width: min(92vw, 380px); color: var(--fg-neutral); background: var(--bg-layer);
    box-shadow: var(--shadow-s3);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 18px; }
  .close { background: transparent; color: var(--fg-neutral-subtle); padding: 4px 8px; }
  .account { margin: 0 0 16px; word-break: break-all; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .tab { background: var(--bg-fill); color: var(--fg-neutral-muted); }
  .tab[aria-selected="true"] { background: var(--bg-brand-solid); color: var(--fg-neutral); }
  #authForm { display: grid; gap: 12px; padding: 0; border: 0; box-shadow: none; background: none; }
  .badge {
    background: var(--bg-brand-solid); color: var(--fg-neutral); border-radius: 999px;
    padding: 2px 8px; font-size: 12px; margin-left: 6px; font-style: normal;
  }
  .info { color: var(--fg-neutral-subtle); font-size: 13px; line-height: 18px; min-height: 18px; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🍜 우리동네 숨은맛집</h1>
    <button type="button" id="userBtn" class="user-btn" aria-label="로그인" title="로그인">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
      </svg>
    </button>
  </div>
  <p class="sub">가본 맛집을 기록해 두세요.</p>

  <dialog id="authDialog" aria-labelledby="authTitle">
    <div class="dlg-head">
      <b id="authTitle">로그인</b>
      <button type="button" class="close" id="authClose" aria-label="닫기">✕</button>
    </div>

    <div id="authSection">
      <div class="tabs" role="tablist">
        <button type="button" class="tab" id="tabLogin" role="tab" aria-selected="true">로그인</button>
        <button type="button" class="tab" id="tabSignup" role="tab" aria-selected="false">회원가입</button>
      </div>
      <form id="authForm" autocomplete="on">
        <label>아이디
          <input id="authId" autocomplete="username" maxlength="20" placeholder="영문 소문자·숫자·_ 3~20자" required>
        </label>
        <label>비밀번호
          <input type="password" id="authPw" minlength="6" autocomplete="current-password" placeholder="6자 이상" required>
        </label>
        <p class="error" id="authError" role="alert"></p>
        <p class="info" id="authInfo"></p>
        <button type="submit" class="add" id="authSubmit">로그인</button>
      </form>
    </div>

    <div id="accountSection" hidden>
      <p class="account"><b id="userName"></b><em class="badge" id="adminBadge" hidden>관리자</em> 님으로 로그인했어요.</p>
      <button type="button" class="add" id="logout">로그아웃</button>
    </div>
  </dialog>

  <form id="form" autocomplete="off">
    <div class="row">
      <label>식당 이름
        <input id="name" maxlength="30" placeholder="예: 할머니국수" required>
      </label>
      <label>메뉴
        <input id="menu" maxlength="30" placeholder="예: 잔치국수">
      </label>
    </div>
    <div class="field">별점
      <input type="hidden" id="rating" value="">
      <div class="rating-btns" id="ratingBtns" role="radiogroup" aria-label="별점">
        <button type="button" class="star-btn" data-v="1" role="radio" aria-checked="false">1☆</button>
        <button type="button" class="star-btn" data-v="2" role="radio" aria-checked="false">2☆</button>
        <button type="button" class="star-btn" data-v="3" role="radio" aria-checked="false">3☆</button>
        <button type="button" class="star-btn" data-v="4" role="radio" aria-checked="false">4☆</button>
        <button type="button" class="star-btn" data-v="5" role="radio" aria-checked="false">5☆</button>
      </div>
    </div>
    <label>한줄평
      <input id="review" maxlength="100" placeholder="한 줄로 남겨 보세요">
    </label>
    <button type="button" id="ai" class="ai">✨ AI 한줄평 추천</button>
    <p class="error" id="error" role="alert"></p>
    <button type="submit" class="add">추가</button>
  </form>

  <div class="list-head">
    <h2>등록된 맛집</h2>
    <button type="button" id="searchBtn" class="icon-btn" aria-label="검색" aria-expanded="false" title="검색">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
    </button>
    <div class="search-pop" id="searchPop" hidden>
      <input type="search" id="searchInput" placeholder="이름·메뉴·한줄평 검색" aria-label="맛집 검색" autocomplete="off">
      <button type="button" class="clear" id="searchClear" aria-label="검색어 지우기">✕</button>
    </div>
  </div>
  <ul id="list"></ul>
</div>

<script>
  // 저장소 계층: Supabase REST API (공개 가능한 publishable 키만 사용)
  const SUPABASE_URL = "https://fcbfuvcpxpndasmqtzen.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ndO8v9FSGgoBbPSeGNTpRQ_eddx0Hk4";
  const API = SUPABASE_URL + "/rest/v1/restaurants";
  const HEADERS = {
    apikey: SUPABASE_KEY,
    Authorization: "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };
  // 로그인 세션 (브라우저에 저장, 막혀 있어도 동작하도록 try/catch)
  const SESSION_KEY = "session";
  let session = null;
  let isAdmin = false;
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { session = null; }
  function saveSession(s) {
    session = s;
    try {
      if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    } catch {}
  }
  function toSession(d) {
    return {
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
      user: { id: d.user.id, email: d.user.email }
    };
  }
  async function authCall(path, body) {
    const res = await fetch(SUPABASE_URL + "/auth/v1" + path, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const text = await res.text();
    const data = text ? JSON.parse(text) : {};
    if (!res.ok) {
      const e = new Error(data.msg || data.error_description || data.message || "요청 실패");
      e.code = data.error_code || data.code;
      throw e;
    }
    return data;
  }
  async function refreshSession() {
    if (!session || !session.refresh_token) return false;
    try {
      const d = await authCall("/token?grant_type=refresh_token", { refresh_token: session.refresh_token });
      saveSession(toSession(d));
      return true;
    } catch {
      saveSession(null);
      return false;
    }
  }
  async function call(url, options, retried) {
    const headers = { ...HEADERS, ...(options && options.headers) };
    if (session) headers.Authorization = "Bearer " + session.access_token;
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401 && session && !retried && (await refreshSession())) {
      return call(url, options, true);
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch {}
    if (!res.ok) {
      const e = new Error("요청 실패 (" + res.status + ")");
      if (data && typeof data.error === "string") e.serverMessage = data.error; // Edge Function의 안내 문구
      throw e;
    }
    return data;
  }
  const store = {
    list() {
      return call(API + "?select=*&order=created_at.desc");
    },
    add(item) {
      return call(API, { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify(item) });
    },
    remove(id) {
      return call(API + "?id=eq." + encodeURIComponent(id), { method: "DELETE" });
    },
    async checkAdmin() {
      try {
        const rows = await call(SUPABASE_URL + "/rest/v1/admins?select=user_id");
        return Array.isArray(rows) && rows.length > 0;
      } catch { return false; }
    }
  };

  const $ = (id) => document.getElementById(id);
  let items = [];

  async function refresh() {
    try {
      items = await store.list();
      $("error").textContent = "";
    } catch (e) {
      $("error").textContent = "목록을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.";
    }
    render();
  }

  function render() {
    const list = $("list");
    list.replaceChildren();
    const q = $("searchInput").value.trim().toLowerCase();
    const shown = !q ? items : items.filter((r) =>
      [r.name, r.menu, r.review].some((v) => String(v || "").toLowerCase().includes(q)));
    if (!shown.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = q
        ? "검색 결과가 없어요. 다른 단어로 찾아 보세요."
        : "아직 등록된 맛집이 없어요. 첫 맛집을 추가해 보세요!";
      list.append(li);
      return;
    }
    // 서버에서 최신순(created_at desc)으로 받아 온다
    for (const r of shown) {
      const li = document.createElement("li");
      li.className = "card";

      const top = document.createElement("div");
      top.className = "card-top";
      const info = document.createElement("div");
      info.className = "info-col";
      const name = document.createElement("p");
      name.className = "name";
      name.textContent = r.name;
      info.append(name);
      if (r.menu) {
        const menu = document.createElement("p");
        menu.className = "menu";
        menu.textContent = r.menu;
        info.append(menu);
      }
      // 오른쪽 위: 음식 종류를 나타내는 이모지
      const emoji = document.createElement("span");
      emoji.className = "food-emoji";
      emoji.textContent = foodEmoji(r);
      emoji.setAttribute("aria-hidden", "true");
      top.append(info, emoji);

      const stars = document.createElement("p");
      stars.className = "stars";
      stars.textContent = "★".repeat(r.rating) + "☆".repeat(5 - r.rating);
      stars.setAttribute("aria-label", "별점 " + r.rating + "점");

      li.append(top, stars);
      if (r.review) {
        const review = document.createElement("p");
        review.className = "review";
        review.textContent = r.review;
        li.append(review);
      }
      // 삭제는 본인이 쓴 글이거나 관리자일 때만 (DB 정책에서도 막는다)
      if (session && (isAdmin || r.user_id === session.user.id)) {
        const del = document.createElement("button");
        del.type = "button";
        del.className = "del";
        del.textContent = "삭제";
        del.addEventListener("click", () => remove(r.id));
        li.append(del);
      }
      list.append(li);
    }
  }

  // 이름·메뉴의 낱말로 음식 이모지를 고른다 (앞에 있는 규칙이 우선).
  const FOOD_EMOJI = [
    [/햄버거|버거/, "🍔"], [/피자/, "🍕"], [/파스타|스파게티|리조또/, "🍝"],
    [/치킨|닭|통닭/, "🍗"], [/초밥|스시|사시미|회|횟집|오마카세/, "🍣"],
    [/족발|보쌈/, "🍖"], [/삼겹|갈비|고기|구이|불고기|바베큐|스테이크|곱창|막창/, "🥩"],
    [/국밥|찌개|전골|탕|해장/, "🍲"], [/라멘|라면|우동|칼국수|국수|냉면|쌀국수|면|소바/, "🍜"],
    [/김밥|분식|떡볶이|순대|튀김|어묵/, "🍢"], [/덮밥|비빔밥|볶음밥|백반|한식|밥/, "🍚"],
    [/카레/, "🍛"], [/만두|딤섬|교자/, "🥟"], [/짜장|짬뽕|탕수육|중식|중국/, "🥡"],
    [/샌드위치|토스트|브런치/, "🥪"], [/타코|멕시/, "🌮"], [/샐러드|채식|비건/, "🥗"],
    [/새우|게장|조개|해산물|낙지|오징어|꽃게|랍스터/, "🦐"],
    [/아이스크림|빙수|젤라또/, "🍨"], [/케이크|디저트|마카롱|와플|도넛/, "🍰"],
    [/빵|베이커리|베이글|크루아상/, "🥐"], [/커피|카페|라떼|에스프레소/, "☕"],
    [/맥주|호프|소주|주점|포차|이자카야|와인|술집/, "🍺"]
  ];
  function foodEmoji(r) {
    const text = (r.name || "") + " " + (r.menu || "");
    for (const [re, emoji] of FOOD_EMOJI) if (re.test(text)) return emoji;
    return "🍽️";
  }

  async function remove(id) {
    try {
      await store.remove(id);
      $("error").textContent = "";
    } catch (e) {
      $("error").textContent = "삭제하지 못했어요. 다시 시도해 주세요.";
    }
    await refresh();
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!session) return openAuth("맛집을 추가하려면 로그인해 주세요.");
    const name = $("name").value.trim();
    const menu = $("menu").value.trim();
    const rating = Number($("rating").value);
    const review = $("review").value.trim();
    const err = $("error");

    if (!name) return (err.textContent = "식당 이름을 입력해 주세요.");
    if (name.length > 30) return (err.textContent = "식당 이름은 30자 이하로 입력해 주세요.");
    if (menu.length > 30) return (err.textContent = "메뉴는 30자 이하로 입력해 주세요.");
    if (!Number.isInteger(rating) || rating < 1 || rating > 5)
      return (err.textContent = "별점을 선택해 주세요.");
    if (review.length > 100) return (err.textContent = "한줄평은 100자 이하로 입력해 주세요.");
    err.textContent = "";

    try {
      await store.add({ name, menu, rating, review });
    } catch (e) {
      err.textContent = "저장하지 못했어요. 다시 시도해 주세요.";
      return;
    }
    $("form").reset();
    await refresh();
  });

  function setRating(v) {
    $("rating").value = v ? String(v) : "";
    for (const b of document.querySelectorAll(".star-btn")) {
      const on = b.dataset.v === $("rating").value;
      b.setAttribute("aria-checked", on ? "true" : "false");
    }
  }
  $("ratingBtns").addEventListener("click", (e) => {
    const b = e.target.closest(".star-btn");
    if (b) setRating(b.dataset.v);
  });
  $("form").addEventListener("reset", () => setRating(""));

  $("ai").addEventListener("click", async () => {
    if (!session) return openAuth("AI 추천은 로그인 후 이용할 수 있어요.");
    const err = $("error");
    const name = $("name").value.trim();
    if (!name) { err.textContent = "AI 추천을 받으려면 식당 이름을 먼저 입력해 주세요."; return; }
    const btn = $("ai");
    btn.disabled = true;
    btn.textContent = "생각 중...";
    err.textContent = "";
    try {
      const data = await call(SUPABASE_URL + "/functions/v1/ai-review", {
        method: "POST",
        body: JSON.stringify({
          name,
          menu: $("menu").value.trim(),
          rating: Number($("rating").value) || 0
        })
      });
      if (!data || !data.review) throw new Error("empty");
      $("review").value = data.review;
    } catch (e) {
      err.textContent = (e && e.serverMessage) || "AI 추천을 받지 못했어요. 잠시 후 다시 시도해 주세요.";
    } finally {
      btn.disabled = false;
      btn.textContent = "✨ AI 한줄평 추천";
    }
  });

  // ----- 검색: 돋보기를 누르면 작은 입력창이 뜬다 (처음에는 숨김) -----
  function setSearchOpen(open) {
    $("searchPop").hidden = !open;
    $("searchBtn").setAttribute("aria-expanded", open ? "true" : "false");
    if (open) $("searchInput").focus();
  }
  function updateSearchIcon() {
    $("searchBtn").classList.toggle("on", !!$("searchInput").value.trim());
  }
  $("searchBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    setSearchOpen($("searchPop").hidden);
  });
  $("searchPop").addEventListener("click", (e) => e.stopPropagation());
  $("searchInput").addEventListener("input", () => { updateSearchIcon(); render(); });
  $("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); setSearchOpen(false); $("searchBtn").focus(); }
  });
  $("searchClear").addEventListener("click", () => {
    $("searchInput").value = "";
    updateSearchIcon();
    render();
    $("searchInput").focus();
  });
  document.addEventListener("click", () => setSearchOpen(false));

  // ----- 로그인 / 회원가입 화면 -----
  let mode = "login";
  function setMode(m) {
    mode = m;
    $("tabLogin").setAttribute("aria-selected", m === "login");
    $("tabSignup").setAttribute("aria-selected", m === "signup");
    $("authSubmit").textContent = m === "login" ? "로그인" : "회원가입";
    $("authPw").autocomplete = m === "login" ? "current-password" : "new-password";
    $("authError").textContent = "";
    $("authInfo").textContent = "";
  }
  $("tabLogin").addEventListener("click", () => setMode("login"));
  $("tabSignup").addEventListener("click", () => setMode("signup"));

  function authMessage(e) {
    const m = (e.message || "").toLowerCase();
    if (m.includes("invalid login")) return "아이디 또는 비밀번호가 맞지 않아요.";
    if (m.includes("not confirmed")) return "아직 사용할 수 없는 계정이에요. 다시 가입해 주세요.";
    if (m.includes("already")) return "이미 사용 중인 아이디예요. 다른 아이디를 써 주세요.";
    if (m.includes("password")) return "비밀번호는 6자 이상으로 입력해 주세요.";
    if (m.includes("rate") || m.includes("too many")) return "잠시 후 다시 시도해 주세요.";
    return "처리하지 못했어요. 입력을 확인하고 다시 시도해 주세요.";
  }

  // 아이디는 내부적으로 가짜 이메일(아이디@idlogin.app)로 바꿔 Supabase Auth에 보낸다.
  const ID_DOMAIN = "@idlogin.app";
  const idToEmail = (id) => id + ID_DOMAIN;
  const emailToId = (email) => String(email).replace(ID_DOMAIN, "");

  function openAuth(message) {
    setMode("login");
    $("authInfo").textContent = message || "";
    if (!$("authDialog").open) $("authDialog").showModal();
  }
  $("userBtn").addEventListener("click", () => {
    if (session) renderAccount();
    else setMode("login");
    if (!$("authDialog").open) $("authDialog").showModal();
  });
  $("authClose").addEventListener("click", () => $("authDialog").close());
  $("authDialog").addEventListener("click", (e) => {
    if (e.target === $("authDialog")) $("authDialog").close();
  });

  function renderAccount() {
    $("authTitle").textContent = "내 계정";
    $("authSection").hidden = true;
    $("accountSection").hidden = false;
    $("userName").textContent = emailToId(session.user.email);
    $("adminBadge").hidden = !isAdmin;
  }

  $("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = $("authId").value.trim().toLowerCase();
    const password = $("authPw").value;
    $("authError").textContent = "";
    $("authInfo").textContent = "";
    if (!/^[a-z0-9_]{3,20}$/.test(id)) {
      $("authError").textContent = "아이디는 영문 소문자·숫자·_ 3~20자로 입력해 주세요.";
      return;
    }
    const email = idToEmail(id);
    $("authSubmit").disabled = true;
    try {
      if (mode === "signup") {
        const d = await authCall("/signup", { email, password });
        if (d.access_token) {
          saveSession(toSession(d));
        } else {
          // 자동 인증이 되지 않은 경우: 바로 로그인 시도
          const t = await authCall("/token?grant_type=password", { email, password });
          saveSession(toSession(t));
        }
      } else {
        const d = await authCall("/token?grant_type=password", { email, password });
        saveSession(toSession(d));
      }
      $("authForm").reset();
      await applyAuth();
      $("authDialog").close();
    } catch (err) {
      $("authError").textContent = authMessage(err);
    } finally {
      $("authSubmit").disabled = false;
    }
  });

  $("logout").addEventListener("click", async () => {
    saveSession(null);
    await applyAuth();
    $("authDialog").close();
  });

  async function applyAuth() {
    isAdmin = session ? await store.checkAdmin() : false;
    const loggedIn = !!session;
    $("userBtn").classList.toggle("on", loggedIn);
    const label = loggedIn ? emailToId(session.user.email) + " (내 계정)" : "로그인";
    $("userBtn").title = label;
    $("userBtn").setAttribute("aria-label", label);
    if (loggedIn) {
      renderAccount();
    } else {
      $("authTitle").textContent = "로그인";
      $("authSection").hidden = false;
      $("accountSection").hidden = true;
    }
    await refresh();
  }

  (async () => {
    if (session && session.expires_at < Math.floor(Date.now() / 1000) + 30) await refreshSession();
    await applyAuth();
  })();
</script>
</body>
</html>
